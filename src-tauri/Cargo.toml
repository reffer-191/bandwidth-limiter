[package]
name = "bandwidth-limiter"
version = "0.4.0"
description = "Bandwidth limiter and traffic monitor for Windows"
authors = ["Fer"]
edition = "2021"

[lib]
name = "bandwidth_limiter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
parking_lot = "0.12"
base64 = "0.22"
png = "0.17"
log = "0.4"
env_logger = "0.11"
window-vibrancy = "0.6"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_Media",
  "Win32_System_Com",
  "Win32_System_Services",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
